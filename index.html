<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <script type="module" src="scripts.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fanwood+Text:ital@0;1&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="header"><h1>ROCK PAPER SCISSORS</h1></div>
    <div class="gameState">
      <h1 id="roundNumber">Round #</h1>
      <div class="gameStateDisplay">
        <div class="playerChoice">
          <h1 class="name">Player</h1>
          <div class="playerChoiceIcon">
            <img />
          </div>
          <h1 id="playerScore" class="score">0</h1>
        </div>
        <h1 id="announcer"></h1>
        <div class="computerChoice">
          <h1 class="name">Computer</h1>
          <div class="computerChoiceIcon">
            <img />
          </div>
          <h1 id="computerScore" class="score">0</h1>
        </div>
      </div>
    </div>
    <div class="menu">
      <div class="gameButtons">
        <button id="rock" aria-label="Rock"></button>
        <button id="paper" aria-label="Paper"></button>
        <button id="scissors" aria-label="Scissors"></button>
      </div>
      <button id="reset" aria-label="Reset"></button>
    </div>
  </body>
</html>
