<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <script type="module" src="scripts.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fanwood+Text:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="header"><h1>ROCK PAPER SCISSORS</h1></div>
    <div class="gameState">
      <h2 class="roundNumber">round number</h2>
      <div class="gameStateDisplay">
        <div class="playerChoice">
          <img src="/svgs/rock.svg" alt="Player" />
        </div>
        <h2 class="winner">Winner</h2>
        <div class="computerChoice">
          <img src="/svgs/paper.svg" alt="Computer" />
        </div>
        <div class="scoreTracker">
          <h2 class="playerScore">Player's Score:</h2>
          <h2 class="computerScore">Computer's Score:</h2>
        </div>
      </div>
    </div>
    <div class="menu">
      <button id="rock" aria-label="Rock"></button>
      <button id="paper" aria-label="Paper"></button>
      <button id="scissors" aria-label="Scissors"></button>
    </div>
    <div class="results">
      <p id="player"></p>
      <p id="computer"></p>
      <p id="announcer"></p>
      <p id="playerScore"></p>
      <p id="computerScore"></p>
      <p id="roundNumber"></p>
    </div>
  </body>
</html>
